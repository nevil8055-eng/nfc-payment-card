<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102019">
<title>Pay Nevil Shah | UPI</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 16px;display:grid;place-items:center;background:#f1f5f2;color:#142019;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:100%;max-width:410px;padding:26px 22px;background:#fff;border:1px solid #e2e8e3;border-radius:24px;box-shadow:0 12px 38px #14201912;text-align:center}
.logo{margin:0 auto 12px;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:#dcfce7;color:#166534;font-size:30px;font-weight:800}
h1{font-size:25px;margin:0}.sub{font-size:14px;color:#66736a;margin:8px 0 18px;line-height:1.5}
.qrbox{display:inline-flex;min-width:230px;min-height:230px;align-items:center;justify-content:center;border:1px solid #e5e7eb;border-radius:18px;padding:10px;background:#fff}#qrcode{width:210px;height:210px}
.label{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#66736a;margin:18px 0 6px}.upi{font-size:17px;font-weight:750;overflow-wrap:anywhere}
.btn{display:block;width:100%;border:0;border-radius:13px;padding:15px 12px;margin-top:12px;font-size:16px;font-weight:750;text-decoration:none;cursor:pointer}.pay{background:#15803d;color:#fff;margin-top:20px}.copy{background:#f0f2f0;color:#17201c}
#status{min-height:18px;margin-top:9px;font-size:13px;color:#166534;line-height:1.5}.note{font-size:12px;color:#66736a;margin:14px 0 0;line-height:1.5}
</style>
</head>
<body><main>
<div class="logo">₹</div><h1>Pay Nevil Shah</h1>
<p class="sub">Tap below to open a UPI payment app, or scan this QR code with a UPI app.</p>
<div class="qrbox"><div id="qrcode">Loading QR…</div></div>
<div class="label">UPI ID</div><div class="upi">nevil8055@unitypay</div>
<a class="btn pay" id="pay" href="upi://pay?pa=nevil8055%40unitypay&amp;pn=Nevil%20Shah&amp;cu=INR">Pay Now with UPI</a>
<button class="btn copy" id="copy" type="button">Copy UPI ID</button><div id="status" role="status"></div>
<p class="note">Enter the amount in your UPI app and verify the recipient name and UPI ID before paying. This page does not confirm or track payments.</p>
</main>
<script>
(function(){
 const id="nevil8055@unitypay";
 const uri="upi://pay?pa="+encodeURIComponent(id)+"&pn="+encodeURIComponent("Nevil Shah")+"&cu=INR";
 document.getElementById("pay").href=uri;
 const status=document.getElementById("status");
 document.getElementById("copy").addEventListener("click",async()=>{
   try{
     if(navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(id);
     else {const ta=document.createElement("textarea");ta.value=id;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();if(!document.execCommand("copy"))throw new Error("copy failed");ta.remove();}
     status.textContent="UPI ID copied. If Pay Now does not open an app, open your UPI app and choose Pay to UPI ID.";
   }catch(e){status.textContent="Copy this UPI ID manually: "+id;}
 });
 function fallback(){document.getElementById("qrcode").innerHTML="<div style='font-size:13px;line-height:1.5;padding:10px'>QR unavailable.<br>Use UPI ID:<br><b>"+id+"</b></div>";}
 function makeQR(){document.getElementById("qrcode").innerHTML="";new QRCode(document.getElementById("qrcode"),{text:uri,width:210,height:210,correctLevel:QRCode.CorrectLevel.M});}
 const script=document.createElement("script");script.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";script.onload=makeQR;script.onerror=fallback;document.head.appendChild(script);
})();
</script>
</body></html>
